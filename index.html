<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crossy Road</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  
  <script>
    // ========== Constants ==========
    const COLS = 15;
    const TILE_W = 48;
    const TILE_H = 24;
    const TILE_DEPTH = 20;
    const CANVAS_W = 900;
    const CANVAS_H = 700;
    const PLAYER_START_COL = Math.floor(COLS / 2);
    const LOOKAHEAD = 12;
    
    // Isometric projection
    function isoX(col, row) {
      return (col + row) * TILE_W / 2;
    }
    
    function isoY(col, row) {
      return (col - row) * TILE_H / 2;
    }

    // Vehicle colors
    const VEHICLE_COLORS = [
      { body: '#8B5CF6', dark: '#6D28D9', light: '#A78BFA', window: '#1F2937' },
      { body: '#10B981', dark: '#059669', light: '#34D399', window: '#1F2937' },
      { body: '#F59E0B', dark: '#D97706', light: '#FBBF24', window: '#1F2937' },
      { body: '#EF4444', dark: '#DC2626', light: '#F87171', window: '#1F2937' },
      { body: '#3B82F6', dark: '#2563EB', light: '#60A5FA', window: '#1F2937' },
      { body: '#EC4899', dark: '#DB2777', light: '#F472B6', window: '#1F2937' }
    ];

    // ========== State ==========
    const state = {
      playerCol: PLAYER_START_COL,
      playerRow: 0,
      maxRow: 0,
      score: 0,
      rows: [],
      lastTime: 0,
      gameOver: false,
      pendingMove: null,
      cameraX: 0,
      cameraY: 0
    };

    // ========== Canvas Setup ==========
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;

    // ========== World Generation ==========
    function generateRow(rowIndex) {
      if (rowIndex === 0) {
        state.rows.push({
          type: 'safe',
          baseColor: '#4ADE80'
        });
        return;
      }

      let trafficCount = 0;
      for (let i = state.rows.length - 1; i >= 0; i--) {
        if (state.rows[i].type === 'traffic') {
          trafficCount++;
        } else {
          break;
        }
      }

      const forceSafe = trafficCount >= 3;
      const isTraffic = forceSafe ? false : Math.random() < 0.5;

      if (isTraffic) {
        const direction = Math.random() < 0.5 ? 1 : -1;
        const speed = 1 + Math.random() * 2;
        const vehicles = [];

        const minGap = 4;
        let col = Math.random() * minGap - 2;
        while (col < COLS + 4) {
          const colorScheme = VEHICLE_COLORS[Math.floor(Math.random() * VEHICLE_COLORS.length)];
          const size = 1.2 + Math.random() * 0.4;
          vehicles.push({ col, size, colors: colorScheme });
          col += size + minGap + Math.random() * 3;
        }

        state.rows.push({
          type: 'traffic',
          baseColor: '#4B5563',
          direction,
          speed,
          vehicles
        });
      } else {
        state.rows.push({
          type: 'safe',
          baseColor: '#4ADE80'
        });
      }
    }

    function ensureRowsAhead() {
      const target = state.playerRow + LOOKAHEAD;
      while (state.rows.length <= target) {
        generateRow(state.rows.length);
      }
    }

    // ========== Input Handling ==========
    const KEYS = {
      ArrowUp: { dr: 1, dc: 0 }, w: { dr: 1, dc: 0 }, W: { dr: 1, dc: 0 },
      ArrowDown: { dr: -1, dc: 0 }, s: { dr: -1, dc: 0 }, S: { dr: -1, dc: 0 },
      ArrowLeft: { dr: 0, dc: -1 }, a: { dr: 0, dc: -1 }, A: { dr: 0, dc: -1 },
      ArrowRight: { dr: 0, dc: 1 }, d: { dr: 0, dc: 1 }, D: { dr: 0, dc: 1 }
    };

    document.addEventListener('keydown', e => {
      if (state.gameOver && (e.key === 'r' || e.key === 'R' || e.key === 'Enter')) {
        resetGame();
        return;
      }
      
      if (KEYS[e.key]) {
        e.preventDefault();
        if (!state.gameOver) {
          state.pendingMove = KEYS[e.key];
        }
      }
    });

    canvas.addEventListener('click', () => {
      if (state.gameOver) resetGame();
    });

    // ========== Player Movement ==========
    function handleInput() {
      if (state.gameOver || !state.pendingMove) return;
      
      const { dr, dc } = state.pendingMove;
      state.pendingMove = null;

      const newRow = state.playerRow + dr;
      const newCol = state.playerCol + dc;

      if (newCol < 0 || newCol >= COLS) return;
      if (newRow < 0) return;

      state.playerRow = newRow;
      state.playerCol = newCol;
      updateScore();
    }

    function updateScore() {
      if (state.playerRow > state.maxRow) {
        state.maxRow = state.playerRow;
        state.score = state.maxRow;
      }
    }

    // ========== Vehicle Movement ==========
    function moveVehicles(dt) {
      const dtSec = dt / 1000;
      for (const row of state.rows) {
        if (row.type !== 'traffic') continue;
        const dcol = row.direction * row.speed * dtSec;
        for (const v of row.vehicles) {
          v.col += dcol;
          const wrapWidth = COLS + 8;
          if (v.col > COLS + 4) v.col -= wrapWidth;
          if (v.col < -4) v.col += wrapWidth;
        }
      }
    }

    // ========== Collision Detection ==========
    function checkCollision() {
      const row = state.rows[state.playerRow];
      if (!row || row.type === 'safe') return;

      for (const v of row.vehicles) {
        const dist = Math.abs(v.col - state.playerCol);
        if (dist < v.size * 0.6) {
          state.gameOver = true;
          return;
        }
      }
    }

    // ========== Isometric Rendering ==========
    
    function drawIsoCube(col, row, width, depth, height, topColor, leftColor, rightColor, screenX, screenY) {
      const x = isoX(col, row) + screenX;
      const y = screenY + isoY(col, row);
      
      const x2 = isoX(col + width, row) + screenX;
      const y2 = screenY + isoY(col + width, row);
      
      const x3 = isoX(col + width, row + depth) + screenX;
      const y3 = screenY + isoY(col + width, row + depth);
      
      const x4 = isoX(col, row + depth) + screenX;
      const y4 = screenY + isoY(col, row + depth);
      
      // Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
      ctx.beginPath();
      ctx.moveTo(x + 3, y + height + 3);
      ctx.lineTo(x2 + 3, y2 + height + 3);
      ctx.lineTo(x3 + 3, y3 + height + 3);
      ctx.lineTo(x4 + 3, y4 + height + 3);
      ctx.closePath();
      ctx.fill();
      
      // Left face
      ctx.fillStyle = leftColor;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x4, y4);
      ctx.lineTo(x4, y4 - height);
      ctx.lineTo(x, y - height);
      ctx.closePath();
      ctx.fill();
      
      // Right face
      ctx.fillStyle = rightColor;
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x3, y3);
      ctx.lineTo(x3, y3 - height);
      ctx.lineTo(x2, y2 - height);
      ctx.closePath();
      ctx.fill();
      
      // Top face
      ctx.fillStyle = topColor;
      ctx.beginPath();
      ctx.moveTo(x, y - height);
      ctx.lineTo(x2, y2 - height);
      ctx.lineTo(x3, y3 - height);
      ctx.lineTo(x4, y4 - height);
      ctx.closePath();
      ctx.fill();
    }

    function darken(color, percent) {
      const num = parseInt(color.replace('#', ''), 16);
      const amt = Math.round(2.55 * percent);
      const R = Math.max(0, (num >> 16) - amt);
      const G = Math.max(0, ((num >> 8) & 0x00FF) - amt);
      const B = Math.max(0, (num & 0x0000FF) - amt);
      return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
    }

    function drawVehicleIso(col, row, size, colors, screenX, screenY) {
      const width = size;
      const depth = 0.8;
      const height = TILE_DEPTH * 0.8;
      
      // Main body
      drawIsoCube(col, row - depth/2, width, depth, height, 
                  colors.light, colors.dark, colors.body, screenX, screenY);
      
      // Cabin/windows
      const cabinW = size * 0.5;
      const cabinCol = col + size * 0.25;
      const cabinHeight = height * 0.6;
      drawIsoCube(cabinCol, row - depth/2 + 0.1, cabinW, depth * 0.6, cabinHeight,
                  colors.window, darken(colors.window, 10), darken(colors.window, 5), 
                  screenX, screenY - height);
    }

    function drawPlayerIso(col, row, screenX, screenY) {
      const size = 0.7;
      const bodyH = TILE_DEPTH * 0.9;
      const headH = TILE_DEPTH * 0.6;
      
      // Body
      drawIsoCube(col - size/2, row - size/2, size, size, bodyH,
                  '#FCD34D', darken('#FCD34D', 15), '#FBBF24', screenX, screenY);
      
      // Head
      const headSize = size * 0.7;
      const headCol = col - headSize/2;
      drawIsoCube(headCol, row - headSize/2, headSize, headSize, headH,
                  '#FEF3C7', darken('#FEF3C7', 10), '#FDE68A', screenX, screenY - bodyH);
      
      // Eyes
      const eyeX = isoX(col, row) + screenX;
      const eyeY = screenY + isoY(col, row) - bodyH - headH + 8;
      ctx.fillStyle = '#000000';
      ctx.fillRect(eyeX - 6, eyeY, 3, 3);
      ctx.fillRect(eyeX + 3, eyeY, 3, 3);
    }

    function draw() {
      // Sky gradient
      const gradient = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
      gradient.addColorStop(0, '#87CEEB');
      gradient.addColorStop(1, '#E0F6FF');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      
      // Camera centers on player - adjusted to properly center both X and Y
      const centerCol = PLAYER_START_COL;  // Center column for the board
      const centerRow = 0;  // Center row reference
      
      const targetCameraX = CANVAS_W / 2 - isoX(state.playerCol, state.playerRow) + isoX(centerCol, centerRow);
      const targetCameraY = CANVAS_H * 0.7 - isoY(state.playerCol, state.playerRow) + isoY(centerCol, centerRow);
      
      state.cameraX += (targetCameraX - state.cameraX) * 0.15;
      state.cameraY += (targetCameraY - state.cameraY) * 0.15;
      
      // Collect all drawable objects - FIX: proper depth sorting
      const drawables = [];
      
      // Add rows and their contents
      for (let r = 0; r < state.rows.length; r++) {
        const row = state.rows[r];
        
        // Each tile in the row
        for (let c = 0; c < COLS; c++) {
          const baseColor = row.baseColor;
          // Sort key: col + row gives proper back-to-front order
          const sortKey = c + r;
          
          drawables.push({
            sortKey,
            draw: () => {
              drawIsoCube(c, r, 1, 1, TILE_DEPTH,
                         baseColor, darken(baseColor, 20), darken(baseColor, 10),
                         state.cameraX, state.cameraY);
            }
          });
        }
        
        // Road markings (draw after row tiles)
        if (row.type === 'traffic') {
          for (let c = 2; c < COLS - 2; c += 2) {
            const sortKey = c + r + 0.1;  // Slightly after the tile
            drawables.push({
              sortKey,
              draw: () => {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                const x = isoX(c, r) + state.cameraX;
                const y = state.cameraY + isoY(c, r) - TILE_DEPTH + 2;
                ctx.fillRect(x, y, 20, 3);
              }
            });
          }
        }
        
        // Add vehicles from this row
        if (row.type === 'traffic') {
          for (const v of row.vehicles) {
            const sortKey = v.col + r + 0.5;  // Vehicles sort by their position
            drawables.push({
              sortKey,
              draw: () => drawVehicleIso(v.col, r, v.size, v.colors, state.cameraX, state.cameraY)
            });
          }
        }
      }
      
      // Add player
      const playerSortKey = state.playerCol + state.playerRow + 0.5;
      drawables.push({
        sortKey: playerSortKey,
        draw: () => drawPlayerIso(state.playerCol, state.playerRow, state.cameraX, state.cameraY)
      });
      
      // Sort back to front and draw
      drawables.sort((a, b) => a.sortKey - b.sortKey);
      for (const obj of drawables) {
        obj.draw();
      }
      
      // HUD
      ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
      ctx.shadowBlur = 4;
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 28px Arial';
      ctx.fillText(`Score: ${state.score}`, 20, 40);
      ctx.shadowBlur = 0;

      if (state.gameOver) {
        drawGameOverOverlay();
      }
    }

    function drawGameOverOverlay() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 64px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', CANVAS_W / 2, CANVAS_H / 2 - 50);

      ctx.font = 'bold 42px Arial';
      ctx.fillStyle = '#FCD34D';
      ctx.fillText(`Score: ${state.score}`, CANVAS_W / 2, CANVAS_H / 2 + 20);

      ctx.font = '24px Arial';
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText('Press R or Click to Restart', CANVAS_W / 2, CANVAS_H / 2 + 80);

      ctx.shadowBlur = 0;
      ctx.textAlign = 'left';
    }

    // ========== Reset ==========
    function resetGame() {
      state.playerCol = PLAYER_START_COL;
      state.playerRow = 0;
      state.maxRow = 0;
      state.score = 0;
      state.rows = [];
      state.lastTime = 0;
      state.gameOver = false;
      state.pendingMove = null;
      state.cameraX = 0;
      state.cameraY = 0;
      ensureRowsAhead();
    }

    // ========== Game Loop ==========
    function tick(timestamp) {
      let dt = timestamp - state.lastTime;
      if (dt > 100) dt = 100;
      state.lastTime = timestamp;

      ensureRowsAhead();
      handleInput();
      
      if (!state.gameOver) {
        moveVehicles(dt);
        checkCollision();
      }
      
      draw();
      requestAnimationFrame(tick);
    }

    // ========== Initialization ==========
    ensureRowsAhead();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
